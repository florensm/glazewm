# Mission Control: nothing but the workspace, its windows spread out at
# their own sizes on a rounded slab of sharp wallpaper over near-black,
# like macOS. Arrows and the wheel still go through workspaces, and typing
# still searches.
overview:
  layout: "expose"
  workspace_row: "hidden"
  search_hint: false
  backdrop_style: "framed"
  backdrop_frame:
    color: "#1c1c1fff"
    corner_radius: 18
    padding: 28
    shadow: true
  accent_color: "#ffffffff"
  window_highlight:
    style: "ring"
    width: 2
    gap: 3
  expose:
    max_per_row: 0
    gap: 36
    arrangement: "natural"
  effects:
    glow: false
    window_lift: 0.03
