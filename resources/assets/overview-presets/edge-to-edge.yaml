# Edge to edge: the exposé with as little around the windows as can be,
# so each one shows as large as it can.
overview:
  layout: "expose"
  backdrop_style: "framed"
  backdrop_frame:
    color: "#0e0e10ff"
    corner_radius: 10
    padding: 8
    shadow: false
  expose:
    max_per_row: 0
    gap: 10
  window_highlight:
    style: "ring"
    width: 2
    gap: 0
  effects:
    glow: false
    lean: 0
    window_lift: 0.02
