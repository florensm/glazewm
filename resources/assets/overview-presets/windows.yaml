# Windows: Task View. An acrylic blur over the desktop, the windows in an
# even grid, a ring in your accent color around the one under the cursor,
# and the whole view fading in from a little larger, as Windows 11 does.
overview:
  layout: "expose"
  workspace_row: "compact"
  search_hint: false
  backdrop_style: "blur"
  backdrop_blur: 60
  backdrop_tint: "#202024a6"
  expose:
    max_per_row: 0
    gap: 24
    arrangement: "grid"
  accent_color: "accent"
  window_highlight:
    style: "ring"
    width: 3
    gap: 3
  card_color: "#2b2b2fe6"
  surface_color: "#38383dff"
  zoom_style: "fade"
  zoom_easing: "cubic_bezier(0.1, 0.9, 0.2, 1)"
  open_duration_ms: 220
  close_duration_ms: 160
  switch_duration_ms: 220
  highlight_duration_ms: 120
  bounce: 0
  effects:
    window_lift: 0.02
