# Opened by `toggle-overview`.
overview:
  backdrop_blur: 40
  # Its alpha sets how dark the backdrop gets.
  backdrop_tint: "#00000066"
  # "blur", or "framed": the desktop shrinks onto a rounded panel of
  # sharp wallpaper, over `backdrop_frame.color` ("accent" works too).
  backdrop_style: "blur"
  backdrop_frame:
    color: "#161418ff"
    corner_radius: 16
    # Wallpaper around the windows on the panel.
    padding: 32
    shadow: true

  # Defaults to the focused window's border color.
  # accent_color: "accent"

  # Workspace cards, hovered cards and window title strips.
  card_color: "#221e24e6"
  surface_color: "#2d292eff"
  caption_color: "#161217c7"

  text_color: "#e8e0e8ff"
  subtext_color: "#cdc3ceff"
  # What matched, in the search box's list.
  search_color: "#89b4faff"
  # Falls back to Segoe UI on Windows 10.
  font_family: "Segoe UI Variable Text"

  # 'activities' (a row of miniatures over the shown workspace), 'stack'
  # (every workspace stacked top to bottom, each strip at full length; the
  # wheel turned sideways, or with shift, pans it) or 'expose' (as the
  # activities, but the shown workspace's windows, every stack tab
  # included, spread out side by side). Tab switches while open.
  layout: "activities"

  # Corner that opens the overview as the cursor rests in it: 'none',
  # 'top_left', 'top_right', 'bottom_left' or 'bottom_right'.
  hot_corner: "none"
  # How long the cursor rests in the corner first, in ms; 0 is at once.
  hot_corner_delay_ms: 300

  # How it opens and closes: 'zoom' (everything zooms out of the workspace
  # on screen and back into the one picked), 'fade' or 'none'.
  zoom_style: "zoom"
  # Pace of the open and close: any animation easing, e.g. "ease_out" or
  # "spring(1.0, 800, 0.0001)" (which ignores the durations).
  zoom_easing: "cubic_bezier(0.25, 1, 0.5, 1)"
  # 0 makes them instant.
  open_duration_ms: 200
  close_duration_ms: 150
  # How the activities change the workspace they show large: 'slide',
  # 'fade' or 'miniature' (its windows fly out of its miniature).
  switch_style: "slide"
  # Moving to another workspace or layout while open.
  switch_duration_ms: 300
  # Selection and hover highlights settling and fading.
  highlight_duration_ms: 170
  # How far things overshoot before settling: 0 (none) to 0.8 (wobbly).
  bounce: 0.25

  # Marks the selected or hovered window: 'ring', 'glow' or 'none'. Width
  # is the ring's thickness or the glow's reach; gap is the space to the
  # window, both in pixels.
  window_highlight:
    style: "ring"
    width: 2
    gap: 0

  # A scrolling workspace large in the activities: 'visible' (the columns
  # on screen) or 'whole' (the whole strip, scaled to fit).
  strip_view: "visible"

  # 'shown' or 'hidden': the row of workspaces over the large view.
  workspace_row: "shown"

  # The "Type to search" field along the bottom; typing searches anyway.
  search_hint: true

  # Exposé: windows per row before wrapping (0 for as many as shows them
  # largest), and the gap between them.
  # `arrangement`: 'natural' (windows keep their sizes against each other)
  # or 'grid' (all of a row as tall).
  expose:
    max_per_row: 0
    gap: 32
    arrangement: "natural"

  effects:
    # Soft accent glow around the selected workspace.
    glow: true
    # Slowly breathing glow. Keeps the overview animating every frame.
    pulse: false
    # Ring spreading out of a card as it is clicked or a window lands, and
    # drawing in on a window closed from the overview.
    ripples: false
    # Particles over the overview: where a dropped window lands, off the
    # edges of a window closed from it, off the shown workspace as it opens,
    # and off the windows of the workspace it zooms into as it closes.
    # Styles as for `animations.particles`, which sets how they look.
    drop_particles: "sparks"
    close_particles: "dust"
    open_particles: "none"
    exit_particles: "none"
    # Whether a card wobbles as a window lands on it.
    jelly: true
    # Delay between cards popping in on open, in ms: 0 brings them in together.
    stagger_ms: 24
    # How far a hovered card leans toward the cursor, in pixels.
    lean: 8
    # How much the other cards dim while one is hovered: 0 to 1.
    dim: 0
    # How much a dragged window stretches with its speed: 0 to 1.
    squash: 0.5
    # Fading outlines trailing a dragged window: 0 (none) to 8.
    trail: 0
    # How much the picked window grows in the large view: 0 to 0.15.
    window_lift: 0.03
