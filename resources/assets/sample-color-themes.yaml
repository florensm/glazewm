# Color themes for the `set-color-theme <name>` command.
#
# Copy to `%userprofile%/.glzr/glazewm/color-themes.yaml` (next to
# `config.yaml`). Changes are picked up automatically; an invalid edit is
# reported in `errors.log` and the previous themes are kept.
#
# Apply a theme from a keybinding or a window rule in `config.yaml`:
#
#   window_rules:
#     - commands: ["set-color-theme winter"]
#       match:
#         - window_process: { equals: "MyApp" }
#
# Colors are compared in OKLab, a perceptual color space: lightness 0 is
# black, 1 is white, and "chroma" is how colorful a color is.
#
# Every setting is optional. In order of application:
#
#   extends               Start from another theme's settings.
#   background/foreground Gray ramp shorthand: white -> background,
#                         black -> foreground.
#   ramp                  Gray ramp with 2-8 stops, `{ from, to }`: grays
#                         as light as `from` become `to`, in between is
#                         interpolated. Use instead of background/foreground.
#   saturation_threshold  0-1 (0.15). Pixels more colorful than this skip
#                         the ramp: images, icons, accent colors. Light
#                         pixels get a higher threshold, so pale tints
#                         (hover and selection highlights) darken too.
#   accent_lightness      0-1 (0). How far colors that skip the ramp still
#                         take on its lightness, keeping their hue. 1 turns
#                         dark blue links into light blue ones on dark.
#   saturation            0-4 (1). Chroma multiplier; 0 is grayscale.
#   vibrance              -1-1 (0). Boosts dull colors more than vivid ones.
#   hue_shift             Degrees (0). Rotates every hue.
#   palette               Palette name (see `palettes`) or a color list.
#                         Colors snap towards the palette hue nearest to
#                         theirs; the palette's grays are ignored.
#   palette_strength      0-1 (1). How far colors move to the palette.
#   palette_lightness     0-1 (0). How far they also take its lightness.
#   brightness            0-2 (1). Lightness multiplier.
#   contrast              0-3 (1). Lightness contrast around mid-gray.
#   min_contrast          0-1 (0). Lightness difference to the themed
#                         background that text and icons keep, capped at the
#                         difference they had originally (so subtle panels
#                         and borders stay subtle). ~0.45 reads well.
#   warmth                -1-1 (0). Cool (blue) to warm (amber).
#   overrides             Up to 16 exact `{ from, to, tolerance }` color
#                         mappings, matched against the app's own colors
#                         and applied last. `tolerance` is an OKLab
#                         distance times 100 (~2 is barely noticeable,
#                         default 5); matches fade out towards its edge.
#                         A `from` is also taken as a known text color:
#                         small text in it (e.g. a link) is re-drawn from
#                         it exactly, instead of guessed from its
#                         anti-aliased edges.
#   detect_colors         true/false (false). Measure the app's own
#                         background and text colors and treat those as
#                         white and black, so an off-white app lands
#                         exactly on `background`. Also re-themes apps that
#                         are already dark into your colors.
#   skip_if_dark          true/false (false). Leave the window alone while
#                         its background is dark (e.g. the app switched to
#                         its own dark mode).
#   keep_pictures         true/false (false). Leave photos, illustrations
#                         and dark banners in their own colors, found from
#                         the window's pixels: areas shaded smoothly in two
#                         directions, and big dark areas on a light page.
#                         Flat graphics (logos, maps) are themed like text.
#                         Needs a Direct3D 11 GPU.

# Named color lists for `palette`.
palettes:
  catppuccin-mocha: [
    "#f5c2e7", "#cba6f7", "#f38ba8", "#eba0ac", "#fab387", "#f9e2af",
    "#a6e3a1", "#94e2d5", "#89dceb", "#74c7ec", "#89b4fa", "#b4befe",
  ]
  nord: [
    "#8fbcbb", "#88c0d0", "#81a1c1", "#5e81ac",
    "#bf616a", "#d08770", "#ebcb8b", "#a3be8c", "#b48ead",
  ]
  gruvbox-dark: [
    "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c",
    "#fe8019",
  ]
  dracula: [
    "#8be9fd", "#50fa7b", "#ffb86c", "#ff79c6", "#bd93f9", "#ff5555",
    "#f1fa8c",
  ]
  tokyo-night: [
    "#7aa2f7", "#7dcfff", "#9ece6a", "#bb9af7", "#f7768e", "#ff9e64",
    "#e0af68", "#73daca",
  ]
  one-dark: [
    "#e06c75", "#98c379", "#e5c07b", "#61afef", "#c678dd", "#56b6c2",
    "#d19a66",
  ]
  solarized: [
    "#b58900", "#cb4b16", "#dc322f", "#d33682", "#6c71c4", "#268bd2",
    "#2aa198", "#859900",
  ]
  rose-pine: [
    "#eb6f92", "#f6c177", "#ebbcba", "#31748f", "#9ccfd8", "#c4a7e7",
  ]
  everforest: [
    "#e67e80", "#e69875", "#dbbc7f", "#a7c080", "#83c092", "#7fbbb3",
    "#d699b6",
  ]
  kanagawa: [
    "#e46876", "#ffa066", "#e6c384", "#98bb6c", "#7aa89f", "#7e9cd8",
    "#957fb8", "#d27e99",
  ]
  github-dark: [
    "#58a6ff", "#3fb950", "#f85149", "#d29922", "#bc8cff", "#db6d28",
    "#39c5cf",
  ]
  # For the `midnight` and `ember` themes below.
  neon: [
    "#5ccfe6", "#7aa2ff", "#b48cff", "#ff7ab2", "#ffcc66", "#8be28b",
  ]
  embers: [
    "#f28c52", "#e8b44c", "#d9695f", "#b7c26b", "#7fb3a8", "#c9a0dc",
  ]

themes:
  # Every theme below keeps pictures (`keep_pictures`) except `night` and
  # `grayscale`, which are meant to change everything; remove the line to
  # theme pictures too.

  # A plain dark theme for light apps.
  winter:
    background: "#1e1e1e"
    foreground: "#d4d4d4"
    saturation_threshold: 0.15
    overrides:
      # Yellow highlight -> dark olive.
      - { from: "#fff3b0", to: "#5a4a00", tolerance: 10 }
      # Windows accent blue -> a lighter blue that reads on dark.
      - { from: "#0078d4", to: "#4aa3ff", tolerance: 6 }
    keep_pictures: true

  # Catppuccin Mocha: separate surface colors, and readable accents in
  # the palette's colors.
  catppuccin:
    ramp:
      - { from: "#ffffff", to: "#1e1e2e" } # Page.
      - { from: "#f0f0f0", to: "#181825" } # Side panels.
      - { from: "#d0d0d0", to: "#45475a" } # Borders, separators.
      - { from: "#000000", to: "#cdd6f4" } # Text.
    accent_lightness: 0.8
    vibrance: 0.3
    palette: catppuccin-mocha
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  nord:
    ramp:
      - { from: "#ffffff", to: "#2e3440" }
      - { from: "#f0f0f0", to: "#3b4252" }
      - { from: "#000000", to: "#eceff4" }
    accent_lightness: 0.8
    palette: nord
    palette_strength: 0.7
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  gruvbox:
    background: "#282828"
    foreground: "#ebdbb2"
    accent_lightness: 0.8
    palette: gruvbox-dark
    palette_strength: 0.7
    warmth: 0.15
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # Everything from `gruvbox`, with Dracula's colors.
  dracula:
    extends: gruvbox
    background: "#282a36"
    foreground: "#f8f8f2"
    palette: dracula
    warmth: 0

  tokyo-night:
    ramp:
      - { from: "#ffffff", to: "#1a1b26" }
      - { from: "#f0f0f0", to: "#16161e" }
      - { from: "#000000", to: "#c0caf5" }
    accent_lightness: 0.8
    vibrance: 0.2
    palette: tokyo-night
    palette_strength: 0.7
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # Well-known editor themes, with their surfaces, text and accent colors.

  one-dark:
    ramp:
      - { from: "#ffffff", to: "#282c34" }
      - { from: "#f0f0f0", to: "#21252b" }
      - { from: "#d0d0d0", to: "#3e4451" }
      - { from: "#000000", to: "#abb2bf" }
    accent_lightness: 0.8
    palette: one-dark
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  solarized-dark:
    ramp:
      - { from: "#ffffff", to: "#002b36" }
      - { from: "#f0f0f0", to: "#073642" }
      - { from: "#d0d0d0", to: "#586e75" }
      - { from: "#000000", to: "#93a1a1" }
    accent_lightness: 0.7
    palette: solarized
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  rose-pine:
    ramp:
      - { from: "#ffffff", to: "#191724" }
      - { from: "#f0f0f0", to: "#1f1d2e" }
      - { from: "#d0d0d0", to: "#26233a" }
      - { from: "#000000", to: "#e0def4" }
    accent_lightness: 0.8
    vibrance: 0.2
    palette: rose-pine
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  everforest:
    ramp:
      - { from: "#ffffff", to: "#2d353b" }
      - { from: "#f0f0f0", to: "#232a2e" }
      - { from: "#d0d0d0", to: "#475258" }
      - { from: "#000000", to: "#d3c6aa" }
    accent_lightness: 0.75
    palette: everforest
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  kanagawa:
    ramp:
      - { from: "#ffffff", to: "#1f1f28" }
      - { from: "#f0f0f0", to: "#16161d" }
      - { from: "#d0d0d0", to: "#54546d" }
      - { from: "#000000", to: "#dcd7ba" }
    accent_lightness: 0.75
    palette: kanagawa
    palette_strength: 0.8
    min_contrast: 0.45
    warmth: 0.1
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  github-dark:
    ramp:
      - { from: "#ffffff", to: "#0d1117" }
      - { from: "#f0f0f0", to: "#010409" }
      - { from: "#d0d0d0", to: "#30363d" }
      - { from: "#000000", to: "#e6edf3" }
    accent_lightness: 0.8
    palette: github-dark
    palette_strength: 0.8
    min_contrast: 0.45
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # Original dark themes.

  # Deep navy-black with bright, cool neon accents.
  midnight:
    ramp:
      - { from: "#ffffff", to: "#0b0f1a" }
      - { from: "#f0f0f0", to: "#070a12" }
      - { from: "#d0d0d0", to: "#1c2433" }
      - { from: "#000000", to: "#d6e2f0" }
    accent_lightness: 0.85
    vibrance: 0.4
    palette: neon
    palette_strength: 0.9
    min_contrast: 0.5
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # Warm charcoal with cream text and ember accents, easy on the eyes late.
  ember:
    ramp:
      - { from: "#ffffff", to: "#1c1714" }
      - { from: "#f0f0f0", to: "#15110f" }
      - { from: "#d0d0d0", to: "#3a2f28" }
      - { from: "#000000", to: "#e8d9c5" }
    accent_lightness: 0.75
    palette: embers
    palette_strength: 0.85
    min_contrast: 0.45
    warmth: 0.2
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # Neutral soft gray with muted colors and gentle contrast, for long
  # reading and spreadsheets.
  graphite:
    ramp:
      - { from: "#ffffff", to: "#26272b" }
      - { from: "#f0f0f0", to: "#1f2023" }
      - { from: "#d0d0d0", to: "#3a3c42" }
      - { from: "#000000", to: "#c9ccd1" }
    accent_lightness: 0.7
    saturation: 0.7
    min_contrast: 0.4
    detect_colors: true
    skip_if_dark: true
    keep_pictures: true

  # A light, paper-like theme for reading: warm off-white instead of pure
  # white, dark brown text.
  sepia:
    background: "#f4ecd8"
    foreground: "#5b4636"
    saturation: 0.8
    detect_colors: true
    keep_pictures: true

  # Keeps the app's own look, dimmer and warmer for the evening.
  night:
    brightness: 0.85
    warmth: 0.5

  # No color, for focus.
  grayscale:
    saturation: 0
