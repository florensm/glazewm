animations:
  # Which animating windows keep their border and backdrop overlays: 'all',
  # 'focused_only' or 'none'. Fewer is smoother with many windows.
  overlay_tracking: "all"

  # Windows changing position.
  window_move:
    enabled: true
    duration_ms: 150
    # Named: 'linear', 'ease_in', 'ease_out', 'ease_in_out', 'ease_in_cubic',
    # 'ease_out_cubic', 'ease_in_out_cubic', 'ease_out_spring'.
    # Custom: 'cubic_bezier(x1, y1, x2, y2)'.
    # Spring: 'spring(damping_ratio, stiffness, epsilon)', or just 'spring'.
    # Lasts until settled, ignoring `duration_ms`. Damping below 1 bounces.
    easing: "cubic_bezier(0.2, 0.0, 0.0, 1.0)"
    # Smallest move, in pixels, that animates.
    threshold_px: 10

  # Scrolling layout columns moving and resizing. Same keys as `window_move`.
  scroll:
    enabled: true
    duration_ms: 220
    easing: "spring(1.0, 800, 0.0001)"

  window_resize:
    enabled: true
    duration_ms: 150
    easing: "cubic_bezier(0.2, 0.0, 0.0, 1.0)"
    threshold_px: 10
    # 'fill' keeps the content's size and fills the rest with its edge color;
    # 'stretch' scales it. Windows only.
    style: "fill"

  # Windows only.
  window_open:
    enabled: true
    duration_ms: 150
    easing: "cubic_bezier(0.16, 1.0, 0.3, 1.0)"
    # 'slide_right', 'slide_left', 'slide_top', 'slide_bottom', 'zoom', 'none'.
    style: "slide_right"
    # 0.0 to 1.0. Below 1.0 fades in.
    opacity_from: 1.0

  workspace_switch:
    enabled: true
    duration_ms: 350
    easing: "ease_out_cubic"
    # 'slide', 'fade', 'zoom' or 'iris' (Windows only).
    style: "slide"
    # For 'slide': 'horizontal' or 'vertical'.
    direction: "horizontal"
    # For 'iris': 'center', 'cursor' or 'focused_window'.
    iris_origin: "center"
    # 0.0 to 1.0. Both at 0.0 is a crossfade.
    opacity_outgoing: 1.0
    opacity_incoming: 1.0
    # For 'slide': how far workspaces shrink while sliding, 0.0 to 1.0.
    zoom_factor: 0.0

  # Windows only.
  window_close:
    enabled: true
    duration_ms: 150
    easing: "ease_in_cubic"
    # 'none', 'zoom', 'slide_left', 'slide_right', 'slide_top', 'slide_bottom'.
    style: "none"
    # 0.0 to 1.0. Below 1.0 fades out.
    opacity_to: 0.0

  # Plays in reverse on restore. Only for minimizes the WM does itself
  # (e.g. `toggle-minimized`). Windows only.
  window_minimize:
    enabled: false
    duration_ms: 150
    easing: "ease_in_cubic"
    # 'zoom', 'none', 'slide_bottom', 'slide_top', 'slide_left', 'slide_right'.
    style: "zoom"
    opacity_to: 0.0

general:
  # E.g. `["shell-exec zebar"]`.
  startup_commands: []

  # E.g. `["shell-exec taskkill /IM zebar.exe /F"]`.
  shutdown_commands: []

  config_reload_commands: []

  focus_follows_cursor: false

  # Focusing the current workspace again goes back to the previous one.
  toggle_workspace_on_refocus: false

  # Keep focus when a window on a hidden workspace grabs it (e.g. Discord),
  # and mark that window urgent instead.
  ignore_focus_steal: false

  # Create workspaces beyond `workspaces` on demand, removed once empty.
  dynamic_workspaces: true

  # Layout of workspaces without their own `layout`. Change it at runtime
  # with `set-layout <layout>`.
  #   'split'     - new windows tile beside the focused one.
  #   'dwindle'   - each new window halves the focused one.
  #   'scrolling' - columns on a strip that scrolls sideways.
  default_layout: "split"

  cursor_jump:
    enabled: true
    # 'monitor_focus' or 'window_focus'.
    trigger: "monitor_focus"

  # How windows of hidden workspaces are hidden: 'cloak' (recommended),
  # 'hide' (legacy) or 'place_in_corner' (always used on macOS).
  hide_method: "cloak"

  # Show windows of every workspace in the taskbar, not only shown ones.
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: "20px"
  outer_gap:
    top: "20px"
    right: "20px"
    bottom: "20px"
    left: "20px"

stack:
  # 0px hides the tab bar. Windows only.
  tab_bar_height: "28px"
  # 'top' or 'bottom'.
  tab_bar_position: "top"

  # Same values as a border's color.
  tab_bar_background: "#1f1f1f"
  tab_active_background: "#3a3a3a"
  tab_hover_background: "#2c2c2c"
  tab_urgent_background: "#8a5a00"
  tab_text_color: "#ffffff"
  tab_inactive_text_color: "#a0a0a0"

  tab_font_family: "Segoe UI"
  tab_font_size: "12px"
  tab_corner_radius: "8px"

  # 'hover', 'always' or 'never'.
  tab_close_button: "hover"

  # Regex replacements for the titles shown on tabs.
  tab_title_overrides: []

  # New windows opened from a stacked window join its stack.
  new_windows_join_focused_stack: false

  # 'end' or 'after_active'.
  new_tab_position: "end"

  # Popups of apps with stacked windows open floating.
  float_owned_popups: true

  # Put matching windows into a named stack as they open.
  auto_stack: []
  # auto_stack:
  #   - name: "browsers"
  #     match:
  #       - window_process: { equals: "firefox" }
  #     exclude:
  #       - window_title: { includes: "Picture-in-Picture" }
  #     # Keys sent to each window as it joins.
  #     send_keys_on_join: ["ctrl+t"]
  #     # Close older tabs with the joining window's title.
  #     duplicates: "close_older"
  #     # Let a still untitled window this big join right away.
  #     join_untitled:
  #       min_width: "800px"
  #       min_height: "500px"

window_effects:
  hide_border_on_fullscreen: false

  focused_window:
    border:
      enabled: true
      # A hex color ('#rrggbb' or '#rrggbbaa'), 'accent' for the OS accent
      # color, or a CSS variable from a palette file (re-read on change):
      color: "#8dbcff"
      # color: "accent"
      # color:
      #   file: "C:/Users/me/.config/yasb/yasb_colors.css"
      #   key: "--yasb-accent"
      width: "2px"
      # Defaults to the window's corner radius plus the width.
      # radius: "12px"

    hide_title_bar:
      enabled: false      # Can break rendering in some apps.

    # Overrides corner_style, for the window and its border and backdrop.
    # corner_radius: "8px"

    corner_style:         # Windows 11 only.
      enabled: true
      style: "square"     # 'square', 'rounded' or 'small_rounded'.

    transparency:
      enabled: false
      opacity: "95%"      # '0%' is invisible, and so unfocusable.

    # Blurred wallpaper behind the window. Windows 10 1803+.
    backdrop:
      enabled: false
      tint: "#00000030"   # '#rrggbb' or '#rrggbbaa', over the blur.
      blur_amount: 30.0
      opacity: 1.0        # 0 to 1. Of the overlay; prefer vignette.
      saturation: 1.2     # 0 (grayscale) to 2. 1 is unchanged.
      exposure: 0.0       # In stops. Negative darkens.
      contrast: 0.0       # -1 to 1.
      highlights: -0.3    # -1 to 1. Negative tames bright areas.
      shadows: 0.1        # -1 to 1. Positive lifts dark areas.
      vignette: 0.2       # 0 to 1. Darkens toward the window's edges.
      grain: 0.05         # 0 to 1. Frosted-glass noise.
      parallax: 1.0       # 1 pins it to the desktop; lower drifts.

  other_windows:
    border:
      enabled: true
      color: "#a1a1a1"
      width: "2px"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: "square"
    transparency:
      enabled: false
      opacity: "90%"
    # Same keys as above. Differing only in `tint`, `opacity`, `vignette`
    # and `parallax` keeps one blurred image per monitor.
    backdrop:
      enabled: false
      tint: "#00000060"
      blur_amount: 30.0
      opacity: 1.0
      saturation: 1.2
      exposure: 0.0
      contrast: 0.0
      highlights: -0.3
      shadows: 0.1
      vignette: 0.4
      grain: 0.05
      parallax: 1.0

window_behavior:
  # Leave fullscreen when a new window opens on the same workspace.
  exit_fullscreen_on_new_window: true

  # Highlight where a dragged window will land. Windows only.
  drop_indicator:
    enabled: true
    # Defaults to the focused window's border color.
    # color: "accent"

  # 'tiling' or 'floating'.
  initial_state: "tiling"

  # Also the defaults of state commands (e.g. `set-floating`) without flags.
  state_defaults:
    floating:
      centered: true
      shown_on_top: true

    fullscreen:
      # Maximize instead, if the window has a maximize button.
      maximized: false
      shown_on_top: false

# Opened by `toggle-overview`. Windows only.
overview:
  backdrop_blur: 40
  # Its alpha sets how dark the backdrop gets.
  backdrop_tint: "#00000066"

  # Defaults to the focused window's border color.
  # accent_color: "accent"

  # Workspace cards, hovered cards and window title strips.
  card_color: "#221e24e6"
  surface_color: "#2d292eff"
  caption_color: "#161217c7"

  text_color: "#e8e0e8ff"
  subtext_color: "#cdc3ceff"
  # Outline of windows matching a search.
  search_color: "#89b4faff"
  # Falls back to Segoe UI on Windows 10.
  font_family: "Segoe UI Variable Text"

  # 'activities', 'stage', 'carousel' or 'grid'. Tab cycles them while open.
  layout: "activities"

  # Most columns of the grid layout.
  grid_columns: 5

  # 0 makes them instant.
  open_duration_ms: 250
  close_duration_ms: 200
  # Moving to another workspace or layout while open.
  switch_duration_ms: 300
  # Selection and hover highlights gliding and fading.
  highlight_duration_ms: 170

layouts:
  scrolling:
    # Percentage, pixels, or "window" to keep the window's own width.
    default_column_width: "50%"

    # Widths `cycle-column-width` steps through.
    preset_column_widths: ["33.333%", "50%", "66.667%"]

    # 'never', 'always', or 'on_overflow' to center only when it doesn't fit
    # beside the previously focused column.
    center_focused_column: "never"

    always_center_single_column: false

    # Heights `cycle-window-height` steps through.
    preset_window_heights: ["33.333%", "50%", "66.667%"]

    # How a column shows its windows: 'normal' (stacked) or 'tabbed'.
    default_column_display: "normal"

    # How far `focus_follows_cursor` may scroll the strip. "0%" only focuses
    # windows fully on screen. Unset is no limit.
    # focus_follows_cursor_max_scroll: "0%"

    # Room kept free at the sides, so neighbouring columns peek out.
    struts:
      left: "0px"
      right: "0px"

# Scratch workspace shared by all monitors and kept out of cycling.
special_workspace:
  # Must not be numeric, nor a name in `workspaces`.
  name: "special"
  # display_name: "Scratch"
  # 'scrolling', 'split' or 'dwindle'.
  layout: "scrolling"

workspaces:
  # Each can set its own `layout`, e.g. `layout: "scrolling"`.
  - name: "1"
  - name: "2"
  - name: "3"
  - name: "4"
  - name: "5"
  - name: "6"
  - name: "7"
  - name: "8"
  - name: "9"

window_rules:
  # Mark a window urgent when its title changes (e.g. an unread count).
  # - commands: ["set-urgency"]
  #   on: ["title_change"]
  #   match:
  #     - window_process: { equals: "Discord" }
  #       window_title: { regex: '^\(\d+\)' }

  # Open an app on the special workspace. Not `move --special-workspace`,
  # which toggles.
  # - commands: ["move --workspace special"]
  #   match:
  #     - window_process: { equals: "Spotify" }
  - commands: ["ignore"]
    match:
      - window_process: { equals: "zebar" }

      # Browser picture-in-picture.
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

      # Various 3rd-party apps.
      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: "Command Palette" }
        window_class: { equals: "WinUIDesktopWin32WindowClass" }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }
      - window_process: { equals: "EXCEL" }
        window_class: { not_regex: "XLMAIN" }
      - window_process: { equals: "WINWORD" }
        window_class: { not_regex: "OpusApp" }
      - window_process: { equals: "POWERPNT" }
        window_class: { not_regex: "PPTFrameClass" }
      - window_process: { equals: "CleanShot X" }

  # Manage windows the WM would otherwise skip, e.g. tool windows.
  - commands: ['force-manage']
    match:
      - window_process: { equals: 'Flow.Launcher' }
        window_title: { equals: 'Flow.Launcher' }

  # Keep an app's stacked windows usable while it shows a blocking popup.
  # - commands: ["stay-interactive"]
  #   match:
  #     - window_process: { equals: "MyApp" }

binding_modes:
  - name: "stack"
    keybindings:
      # Pull the neighbor in that direction into the stack.
      - commands: ["stack-absorb-neighbor --direction left"]
        bindings: ["h", "left"]
      - commands: ["stack-absorb-neighbor --direction right"]
        bindings: ["l", "right"]
      - commands: ["stack-absorb-neighbor --direction up"]
        bindings: ["k", "up"]
      - commands: ["stack-absorb-neighbor --direction down"]
        bindings: ["j", "down"]
      - commands: ["cycle-stack-focus"]
        bindings: ["n"]
      - commands: ["cycle-stack-focus --prev"]
        bindings: ["p"]
      - commands: ["toggle-stack"]
        bindings: ["g"]
      - commands: ["float-out-of-stack"]
        bindings: ["f"]
      # More stack commands are in docs/stacks.md.
      - commands: ["wm-disable-binding-mode --name stack"]
        bindings: ["escape", "enter"]

  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter", "alt+r"]

keybindings:
  - commands: ["focus --direction left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down"]

  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  - commands: ["resize --width -2%"]
    bindings: ["alt+u"]
  - commands: ["resize --width +2%"]
    bindings: ["alt+p"]
  - commands: ["resize --height +2%"]
    bindings: ["alt+shift+o"]
  - commands: ["resize --height -2%"]
    bindings: ["alt+i"]

  # Resize with arrow keys or HJKL, see `binding_modes`.
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # Pause the WM and all other keybindings until pressed again.
  - commands: ["wm-toggle-pause"]
    bindings: ["alt+shift+p"]

  # Where new tiling windows go.
  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v"]

  - commands: ["toggle-stack"]
    bindings: ["alt+g"]
  # Stack with neighbors or cycle the stack, see `binding_modes`.
  - commands: ["wm-enable-binding-mode --name stack"]
    bindings: ["alt+shift+g"]
  - commands: ["cycle-stack-focus"]
    bindings: ["alt+oem_period"]
  - commands: ["cycle-stack-focus --prev"]
    bindings: ["alt+oem_comma"]

  # Tiling -> floating -> fullscreen.
  - commands: ["wm-cycle-focus"]
    bindings: ["alt+space"]

  - commands: ["toggle-overview"]
    bindings: ["alt+w"]

  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space"]
  - commands: ["toggle-tiling"]
    bindings: ["alt+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]
  - commands: ["toggle-minimized"]
    bindings: ["alt+m"]
  - commands: ["close"]
    bindings: ["alt+shift+q"]

  - commands: ["wm-exit"]
    bindings: ["alt+shift+e"]
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]
  - commands: ["wm-redraw"]
    bindings: ["alt+shift+w"]

  # Or `shell-exec wt` for Windows Terminal.
  - commands: ["shell-exec cmd"]
    bindings: ["alt+enter"]

  - commands: ["focus --next-active-workspace"]
    bindings: ["alt+s"]
  - commands: ["focus --prev-active-workspace"]
    bindings: ["alt+a"]
  - commands: ["focus --recent-workspace"]
    bindings: ["alt+d"]

  # Creates a workspace when all are in use (`dynamic_workspaces`).
  - commands: ["focus --next-empty-workspace"]
    bindings: ["alt+n"]
  - commands: ["move --next-empty-workspace"]
    bindings: ["alt+shift+n"]

  - commands: ["focus --urgent-window"]
    bindings: ["alt+shift+u"]

  # Summon the special workspace or go back; send a window there or back.
  - commands: ["focus --special-workspace"]
    bindings: ["alt+oem_minus"]
  - commands: ["move --special-workspace"]
    bindings: ["alt+shift+oem_minus"]

  # Scrolling layout. Move the window into the neighbouring column, or out
  # of a shared one.
  - commands: ["consume-or-expel-window --direction left"]
    bindings: ["alt+oem_open_brackets"]
  - commands: ["consume-or-expel-window --direction right"]
    bindings: ["alt+oem_close_brackets"]
  - commands: ["cycle-column-width"]
    bindings: ["alt+c"]
  - commands: ["cycle-window-height"]
    bindings: ["alt+shift+c"]
  - commands: ["maximize-column"]
    bindings: ["alt+z"]
  - commands: ["expand-column-to-available-width"]
    bindings: ["alt+shift+z"]
  - commands: ["center-column"]
    bindings: ["alt+x"]
  - commands: ["center-visible-columns"]
    bindings: ["alt+shift+x"]
  - commands: ["toggle-column-tabbed-display"]
    bindings: ["alt+b"]
  - commands: ["focus --first-column"]
    bindings: ["alt+home"]
  - commands: ["focus --last-column"]
    bindings: ["alt+end"]
  - commands: ["move --first-column"]
    bindings: ["alt+shift+home"]
  - commands: ["move --last-column"]
    bindings: ["alt+shift+end"]
  # Also: consume-window-into-column, expel-window-from-column,
  # swap-window, reset-window-height, focus/move --column <n>,
  # focus --next-column.

  # Mouse wheel, Windows only. `cooldown_ms` makes a flick one step.
  - commands: ["focus --next-workspace"]
    bindings: ["alt+wheel_down"]
    cooldown_ms: 150
  - commands: ["focus --prev-workspace"]
    bindings: ["alt+wheel_up"]
    cooldown_ms: 150
  - commands: ["move --next-workspace", "focus --next-workspace"]
    bindings: ["alt+ctrl+wheel_down"]
    cooldown_ms: 150
  - commands: ["move --prev-workspace", "focus --prev-workspace"]
    bindings: ["alt+ctrl+wheel_up"]
    cooldown_ms: 150
  # Along the strip with the horizontal wheel, or with shift held.
  - commands: ["focus --direction right"]
    bindings: ["alt+wheel_right", "alt+shift+wheel_down"]
  - commands: ["focus --direction left"]
    bindings: ["alt+wheel_left", "alt+shift+wheel_up"]
  - commands: ["move --direction right"]
    bindings: ["alt+ctrl+wheel_right", "alt+ctrl+shift+wheel_down"]
  - commands: ["move --direction left"]
    bindings: ["alt+ctrl+wheel_left", "alt+ctrl+shift+wheel_up"]

  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["alt+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["alt+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["alt+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["alt+9"]

  # Move the focused workspace to the monitor in that direction.
  - commands: ["move-workspace --direction left"]
    bindings: ["alt+shift+a"]
  - commands: ["move-workspace --direction right"]
    bindings: ["alt+shift+f"]
  - commands: ["move-workspace --direction up"]
    bindings: ["alt+shift+d"]
  - commands: ["move-workspace --direction down"]
    bindings: ["alt+shift+s"]

  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]
