[package]
name = "wm-platform"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"
test = false

[[test]]
name = "test"
harness = false
path = "src/test.rs"

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }

[features]
test_utils = []

[dev-dependencies]
libtest-mimic-collect = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
  "implement",
  "Foundation",
  # Gates `ShapeVisual::Shapes` and `CompositionShapeCollection`, which the
  # border overlay's stroked ring is built from.
  "Foundation_Collections",
  "Foundation_Numerics",
  # Color themes: `Windows.Graphics.Capture` frames of the themed window,
  # delivered as D3D11 surfaces (`SizeInt32` lives in `Graphics`).
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Effects",
  # `DirectXPixelFormat`/`DirectXAlphaMode`, which `CompositionGraphicsDevice`
  # takes when allocating the wallpaper backdrop's drawing surface.
  "Graphics_DirectX",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  # The wallpaper backdrop bakes its blur once into a composition surface,
  # which needs a real D2D device (built on D3D11) and a WIC decoder for the
  # wallpaper file itself.
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  # Color themes: `CreateForWindow` and the D3D11 <-> WinRT device/surface
  # interop the capture frame pool needs.
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  # `IDesktopWallpaper`, which reports the per-monitor wallpaper image, its
  # fit mode, and the background color behind it.
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
windows-interface = { version = "0.52" }

[target.'cfg(target_os = "macos")'.dependencies]
home = { workspace = true }
objc2-core-graphics = "0.3.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSAlert",
  "NSApplication",
  "NSEvent",
  "NSGraphics",
  "NSRunningApplication",
  "NSResponder",
  "NSScreen",
  "NSWindow",
  "NSWorkspace",
  "libc",
  "objc2-core-foundation",
] }
objc2-application-services = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = [
  "CFCGTypes",
  "CFUUID",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSEnumerator",
  "NSNotification",
  "NSKeyValueCoding",
  "NSString",
  "NSThread",
  "NSValue",
] }

[lints]
workspace = true
