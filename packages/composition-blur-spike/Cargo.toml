[package]
name = "composition-blur-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone proof-of-concept for a Windows.UI.Composition based acrylic
# blur-behind pipeline with a continuously adjustable blur radius and corner
# radius. Not part of the default workspace build; run explicitly via
# `cargo run -p composition-blur-spike`. Once validated, the proven pipeline
# is ported into `wm-platform` as `NativeBlurOverlay`'s new internals.

[[bin]]
name = "composition-blur-spike"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
  "implement",
  # WinRT projections for Windows.UI.Composition.
  "Foundation",
  "Foundation_Numerics",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Graphics",
  "Graphics_Effects",
  # Win32 interop surface.
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.52"
windows-interface = { version = "0.52" }
