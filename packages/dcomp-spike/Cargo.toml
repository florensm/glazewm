[package]
name = "dcomp-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone proof-of-concept for the DirectComposition + Windows.Graphics.Capture
# rendering pipeline. Not part of the default workspace build; run explicitly via
# `cargo run -p dcomp-spike`. Once validated, the proven pipeline is ported into
# `wm-platform` as `NativeDcompSurrogate`.

[[bin]]
name = "dcomp-spike"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
  # WinRT projections for Windows.Graphics.Capture (increment 2).
  "Foundation",
  "Foundation_Numerics",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  # Win32 graphics stack.
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D9",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
