[package]
name = "wm"
version = "0.0.0"
description = "GlazeWM is a tiling window manager for Windows inspired by i3 and Polybar."
repository = "https://github.com/glzr-io/glazewm"
license = "GPL-3"
edition = "2021"
default-run = "glazewm"

[[bin]]
name = "glazewm"
path = "src/main.rs"

[features]
ui_access = []

[build-dependencies]
tauri-winres = { workspace = true }

[dependencies]
regex = { workspace = true }
anyhow = { workspace = true }
auto-launch = "0.5"
ambassador = "0.4"
clap = { workspace = true }
derive_more = { version = "2", features = ["from", "try_into"] }
futures-util = { workspace = true }
home = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
subenum = "1"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true }
tray-icon = "0.21"
uuid = { workspace = true }
wm-cli = { path = "../wm-cli" }
wm-common = { path = "../wm-common" }
wm-platform = { path = "../wm-platform" }

[target.'cfg(target_os = "macos")'.dependencies]
shell-util = "0.0"

[dev-dependencies]
bon = "3"
wm-platform = { path = "../wm-platform", features = ["test_utils"] }

[lints]
workspace = true
